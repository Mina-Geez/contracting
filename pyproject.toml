[project]
name = "insite"
authors = [{ name = "Inspect Solutions", email = "mina@inspect-solutions.com" }]
description = "Contracting for ERPNext: measured quantities, scopes and progress."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
erpnext = ">=15.0.0,<17.0.0"

# Matches the Frappe/ERPNext house style, so a contributor's editor and the
# pre-commit hooks agree with the code already in the repo.
[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF"]
ignore = [
    "B017",
    "E101",   # tabs are the indent style here
    "E501",   # line length is handled by the formatter
    "W191",   # tab indentation
    "RUF001", # the product is bilingual; non-ASCII in strings is deliberate
    "RUF002",
    "RUF003",
]

[tool.ruff.format]
indent-style = "tab"
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["insite/tests"]
