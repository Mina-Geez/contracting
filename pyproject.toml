[project]
name = "insite"
authors = [{ name = "Inspect Solutions", email = "mina@inspect-solutions.com" }]
description = "Insite — configuration-driven contracting vertical for ERPNext"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
