<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Insite">
  <title>Insite</title>
  <rect width="64" height="64" rx="14" fill="#2D5B7A"/>
  <!-- A measured opening: the height and width every rule starts from. -->
  <rect x="18" y="16" width="28" height="32" rx="2" fill="none" stroke="#FFFFFF" stroke-width="3"/>
  <line x1="18" y1="32" x2="46" y2="32" stroke="#FFFFFF" stroke-width="2" opacity="0.55"/>
  <line x1="32" y1="16" x2="32" y2="48" stroke="#FFFFFF" stroke-width="2" opacity="0.55"/>
  <!-- Tick marks, as on a rule. -->
  <line x1="18" y1="53" x2="46" y2="53" stroke="#8FC7E8" stroke-width="2"/>
  <line x1="18" y1="50" x2="18" y2="56" stroke="#8FC7E8" stroke-width="2"/>
  <line x1="32" y1="51" x2="32" y2="55" stroke="#8FC7E8" stroke-width="2"/>
  <line x1="46" y1="50" x2="46" y2="56" stroke="#8FC7E8" stroke-width="2"/>
</svg>
